name: Python Application CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install unittest2 requests selenium

    - name: Run Unit Tests
      run: |
        python -m unittest discover -s "Week 1/UnitTesting" -p "test_*.py"

    - name: Run Advanced SQL Tests
      run: |
        python "Week 1/AdvancedSQL/advanced_sql_exercises.py"
