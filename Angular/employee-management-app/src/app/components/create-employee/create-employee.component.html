<div class="form-container">
  <h2>Create Employee</h2>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="firstName">First Name</label>
      <input type="text" id="firstName" [(ngModel)]="employee.firstName" name="firstName" placeholder="Enter first name">
    </div>
    <div class="form-group">
      <label for="lastName">Last Name</label>
      <input type="text" id="lastName" [(ngModel)]="employee.lastName" name="lastName" placeholder="Enter last name">
    </div>
    <div class="form-group">
      <label for="email">Email</label>
      <input type="email" id="email" [(ngModel)]="employee.email" name="email" placeholder="Enter email">
    </div>
    <button class="btn-success" type="submit">Submit</button>
  </form>
</div>
